# GitHub Actions：自动部署到 GitHub Pages
# 仓库: yuivo9999/bigimax
# 触发条件: push 到 main 分支时自动构建部署
name: Deploy IMAX Theater to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build / 静态文件（无需构建步骤）
        run: |
          echo "项目为纯静态文件，无需构建"
          echo "目录结构:"
          find . -type f -not -path './.git/*' | head -30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
